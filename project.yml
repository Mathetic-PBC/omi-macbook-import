name: OmiImport
options:
  bundleIdPrefix: com.mathetic
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OmiImportCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OmiImport:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/engelbart-library.cjs
        buildPhase: resources
    dependencies:
      - package: OmiImportCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Omi Import
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: Omi Import lets Omi Relay on your iPhone find this Mac to send it recordings.
        NSBonjourServices:
          - _omi-import._tcp
        NSHumanReadableCopyright: Copyright © 2026 Mathetic PBC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathetic.OmiImport
        PRODUCT_NAME: OmiImport
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # A debug build is a different app to macOS, with its own identifier,
        # so it never stands in for the installed copy.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.mathetic.OmiImport.debug

  # The phone app: takes recordings off the pendant and hands them to the Mac.
  OmiRelay:
    type: application
    platform: iOS
    sources:
      - path: Phone/Sources
      - path: Phone/Assets.xcassets
    dependencies:
      - package: OmiImportCore
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Omi Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets iOS wake the app whenever the pendant has something to say.
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Omi Relay connects to your Omi pendant over Bluetooth to take the recordings it has stored.
        NSLocalNetworkUsageDescription: Omi Relay finds your Mac on this network to send it your recordings.
        NSBonjourServices:
          - _omi-import._tcp
        # Only the encryption iOS itself provides.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026 Mathetic PBC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathetic.OmiRelay
        PRODUCT_NAME: OmiRelay
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
